<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextLang</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/windows.css">
</head>
<body>

    <div id="boot-screen">
        <div class="boot-loader">
            <div class="boot-logo">
                <svg viewBox="0 0 24 24"><path fill="#6366f1" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6Z"/></svg>
            </div>
            <div class="boot-text-container">
                <div id="boot-logs"></div>
                <div class="boot-progress-bar">
                    <div id="boot-progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="os-container" style="opacity: 0; pointer-events: none;">
        
        <main id="desktop">
            <div class="desktop-icon os-hover-translate-ignore" data-app="notepad">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#6366f1" d="M14,2H6A2,2 0 0 0 4,4V20A2,2 0 0 0 6,21H18A2,2 0 0 0 20,19V8L14,2M13,3.5L18.5,9H13V3.5M6,19V4H12V10H18V19H6Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Notepad</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="calculator">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#d946ef" d="M7,2H17A2,2 0 0 1 19,4V20A2,2 0 0 1 17,22H7A2,2 0 0 1 5,20V4A2,2 0 0 1 7,2H7M7,4V6H9V4H7M11,4V6H13V4H11M15,4V6H17V4H15M7,8V10H9V8H7M11,8V10H13V8H11M15,8V10H17V8H15M7,12V14H9V12H7M11,12V14H13V12H11M15,12V16H17V12H15M7,16V20H13V16H7Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Calculator</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="explorer">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#a855f7" d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0 0 4,20H20A2,2 0 0 0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Files</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="terminal">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#27c93f" d="M20,19H4A2,2 0 0 1 2,17V7A2,2 0 0 1 4,5H20A2,2 0 0 1 22,7V17A2,2 0 0 1 20,19M4,7V17H20V7H4M6,9H11V11H6V9M6,13H14V15H6V13Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Terminal</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="taskmanager">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#ff5f56" d="M19,3H5C3.89,3 3,3.89 3,4V20A2,2 0 0 0 5,22H19A2,2 0 0 0 21,20V4C21,3.89 20.1,3 19,3M19,20H5V4H19V20M7,12H9V17H7V12M11,7H13V17H11V7M15,10H17V17H15V10Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Monitor</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="browser">
                <div class="icon-wrapper os-hover-translate-ignore">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#38bdf8" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12C4,15.11 5.78,17.81 8.39,19.16L11.5,13.78C10.6,13.43 10,12.54 10,11.5A2,2 0 0 1 12,9.5C12.8,9.5 13.5,10 13.84,10.68L17.74,7.44C16.37,5.33 14.05,4 12,4M19.93,11A8,8 0 0,0 12,4.07V7.5C13,7.5 13.9,8 14.44,8.77L11.5,13.87C11.66,13.95 11.83,14 12,14A2,2 0 0 1 14,12C14,11.23 13.57,10.57 12.93,10.23L16.41,4.2C18.6,5.55 20,11 19.93,11Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Browser</span>
            </div>

            <div class="desktop-icon" data-app="duolingo">
                <div class="icon-avatar" style="font-size: 32px; filter: drop-shadow(0 0 5px rgba(88,204,2,0.5));">🦉</div>
                <span class="icon-label">Duolingo</span>
            </div>

            <div class="desktop-icon" data-app="speechling" onclick="if(window.AppSpeechling) window.AppSpeechling.open();">
                <div class="icon-avatar" style="font-size: 32px; filter: drop-shadow(0 0 5px rgba(16,185,129,0.5));">🦜</div>
                <span class="icon-label">Speechling</span>
            </div>

            <div class="desktop-icon" data-app="music" onclick="if(window.AppYouTubeMusic) window.AppYouTubeMusic.open();">
                <div class="icon-avatar" style="font-size: 32px; filter: drop-shadow(0 0 5px rgba(16,185,129,0.5));">🎵</div>
                <span class="icon-label">Music</span>
            </div>

            <div class="desktop-icon os-hover-translate-ignore" data-app="rufus">
                <div class="icon-wrapper os-hover-translate-ignore" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px;">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#3b82f6" d="M6,2H18A2,2 0 0 1 20,4V20A2,2 0 0 1 18,22H6A2,2 0 0 1 4,20V4A2,2 0 0 1 6,2M6,4V8H18V4H6M6,20H18V10H6V20M8,12H16V14H8V12M8,16H13V18H8V16Z"/></svg>
                </div>
                <span class="icon-label os-hover-translate-ignore">Rufus Host</span>
            </div>
        </main>

        <div id="start-menu" class="hidden">
            <div class="start-menu-sidebar">
                <div class="user-profile">
                    <div id="session-avatar" class="avatar" style="transition: background 0.3s;"></div>
                    <span id="session-username" style="font-weight: 600; color: #fff;">Guest</span>
                    <span id="session-user-role" style="font-size: 10px; color: rgba(255,255,255,0.4); font-family: monospace;">Loading...</span>
                </div>
            </div>
            <div class="start-menu-links">
                <div class="menu-item os-hover-translate-ignore" data-app="settings">⚙️ Settings</div>
                <div class="menu-item os-hover-translate-ignore" data-app="taskmanager">📊 System Monitor</div>
                <div class="menu-item os-hover-translate-ignore" data-app="terminal">📟 Command Prompt</div>
                <div class="menu-item os-hover-translate-ignore" data-app="explorer">📁 File Explorer</div>
                <div class="menu-item os-hover-translate-ignore" data-app="rufus" style="border-top: 1px solid rgba(255,255,255,0.06); color: #60a5fa;">⚡ Launch Rufus</div>
                <div class="menu-item os-hover-translate-ignore shutdown" data-app="shutdown">⚠️ Shut Down Computer</div>
            </div>
        </div>

        <footer id="taskbar">
            <button id="start-button">
                <svg viewBox="0 0 24 24" class="start-icon"><path fill="#ffffff" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6Z"/></svg>
            </button>
            <div id="active-apps"></div>
            <div id="system-tray">
                <span id="system-clock">00:00:00</span>
            </div>
        </footer>
    </div>

    <div id="shutdown-modal" class="shutdown-modal-overlay hidden">
        <div class="shutdown-modal-box">
            <div class="shutdown-modal-header">
                <h3>System Options</h3>
                <button id="close-shutdown-modal" class="close-modal-btn">&times;</button>
            </div>
            <p class="shutdown-modal-body">What would you like the system to do?</p>
            <div class="shutdown-modal-actions">
                <button id="btn-restart" class="action-btn restart-btn">Restart</button>
                <button id="btn-shutdown" class="action-btn shutdown-btn">Shut Down</button>
                <button id="btn-switch-user" class="action-btn switch-btn">Switch User</button>
            </div>
        </div>
    </div>

    <script src="js/translator.js"></script>
    <script src="js/apps/portable1.js"></script>
    <script src="js/os-kernel.js"></script>
    <script src="js/main.js"></script>
    <script src="js/apps/notepad.js"></script>
    <script src="js/apps/calculator.js"></script>
    <script src="js/apps/explorer.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/taskmanager.js"></script>
    <script src="js/apps/terminal.js"></script>
    <script src="js/apps/users.js"></script>
    <script src="js/apps/browser.js"></script>
    <script src="js/apps/duolingo-app.js"></script>
    <script src="js/apps/speechling.js"></script>   
    <script src="js/apps/music.js"></script>   

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.OSTranslator || typeof window.OSTranslator.bindHoverToKey !== 'function') return;

            document.querySelectorAll('.desktop-icon[data-app]').forEach(el => {
                const key = el.getAttribute('data-app');
                if (key) window.OSTranslator.bindHoverToKey(el, key);
            });

            document.querySelectorAll('#start-menu .menu-item[data-app]').forEach(el => {
                const key = el.getAttribute('data-app');
                if (key) window.OSTranslator.bindHoverToKey(el, key);
            });
        });
    </script>
</body>
</html>
