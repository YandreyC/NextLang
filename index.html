<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextLang OS - Futuristic Environment</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/windows.css">
</head>
<body>

    <div id="os-container">
        
        <main id="desktop">
            
            <div class="desktop-icon" data-app="notepad">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#6366f1" d="M14,2H6A2,2 0 0 0 4,4V20A2,2 0 0 0 6,21H18A2,2 0 0 0 20,19V8L14,2M13,3.5L18.5,9H13V3.5M6,19V4H12V10H18V19H6Z"/></svg>
                </div>
                <span class="icon-label">Notepad</span>
            </div>

            <div class="desktop-icon" data-app="calculator">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#d946ef" d="M7,2H17A2,2 0 0 1 19,4V20A2,2 0 0 1 17,22H7A2,2 0 0 1 5,20V4A2,2 0 0 1 7,2H7M7,4V6H9V4H7M11,4V6H13V4H11M15,4V6H17V4H15M7,8V10H9V8H7M11,8V10H13V8H11M15,8V10H17V8H15M7,12V14H9V12H7M11,12V14H13V12H11M15,12V16H17V12H15M7,16V20H13V16H7Z"/></svg>
                </div>
                <span class="icon-label">Calculadora</span>
            </div>

            <div class="desktop-icon" data-app="explorer">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#a855f7" d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0 0 4,20H20A2,2 0 0 0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
                </div>
                <span class="icon-label">Archivos</span>
            </div>

            <div class="desktop-icon" data-app="terminal">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#27c93f" d="M20,19H4A2,2 0 0 1 2,17V7A2,2 0 0 1 4,5H20A2,2 0 0 1 22,7V17A2,2 0 0 1 20,19M4,7V17H20V7H4M6,9H11V11H6V9M6,13H14V15H6V13Z"/></svg>
                </div>
                <span class="icon-label">Terminal</span>
            </div>

            <div class="desktop-icon" data-app="taskmanager">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" class="sys-icon"><path fill="#ff5f56" d="M19,3H5C3.89,3 3,3.89 3,4V20A2,2 0 0 0 5,22H19A2,2 0 0 0 21,20V4C21,3.89 20.1,3 19,3M19,20H5V4H19V20M7,12H9V17H7V12M11,7H13V17H11V7M15,10H17V17H15V10Z"/></svg>
                </div>
                <span class="icon-label">Monitor</span>
            </div>

        </main>

        <div id="start-menu" class="hidden">
            <div class="start-menu-sidebar">
                <div class="user-profile">
                    <div id="session-avatar" class="avatar" style="transition: background 0.3s;"></div>
                    <span id="session-username" style="font-weight: 600; color: #fff;">Guest</span>
                    <span id="session-user-role" style="font-size: 10px; color: rgba(255,255,255,0.4); font-family: monospace;">Loading...</span>
                </div>
            </div>
            <div class="start-menu-links">
                <div class="menu-item" data-app="settings">⚙️ Configuración</div>
                <div class="menu-item" data-app="taskmanager">📊 Monitor del Sistema</div>
                <div class="menu-item" data-app="terminal">📟 Terminal de Comandos</div>
                <div class="menu-item" data-app="explorer">📁 Explorador de Archivos</div>
                <div class="menu-item shutdown">⚠️ Apagar Equipo</div>
            </div>
        </div>

        <footer id="taskbar">
            <button id="start-button">
                <svg viewBox="0 0 24 24" class="start-icon"><path fill="#ffffff" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6Z"/></svg>
            </button>

            <div id="active-apps"></div>

            <div id="system-tray">
                <span id="system-clock">00:00:00</span>
            </div>
        </footer>

    </div>

    <script src="js/translator.js"></script>

    <script src="js/os-kernel.js"></script>

    <script src="js/apps/notepad.js"></script>
    <script src="js/apps/calculator.js"></script>
    <script src="js/apps/explorer.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/taskmanager.js"></script>
    <script src="js/apps/terminal.js"></script>
    <script src="js/apps/users.js"></script> <script src="js/main.js"></script>

</body>
</html>
